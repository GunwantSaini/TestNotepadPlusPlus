[package]
name = "notepad-config"
version = "8.0.0"
edition = "2021"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# XML parsing (for legacy support)
quick-xml = "0.31"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
