[package]
name = "notepad-ui"
version = "8.0.0"
edition = "2021"

[dependencies]
# Local crates
notepad-core = { path = "../core" }
notepad-editor = { path = "../editor" }

# Windows API
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
