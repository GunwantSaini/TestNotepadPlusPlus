[package]
name = "notepad-editor"
version = "8.0.0"
edition = "2021"

[dependencies]
# Text buffer
ropey = "1.6"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
