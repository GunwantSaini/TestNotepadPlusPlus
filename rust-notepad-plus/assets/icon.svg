<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#1E3A8A" stroke="#1E40AF" stroke-width="4"/>

  <!-- Document/notepad shape -->
  <rect x="64" y="48" width="128" height="160" rx="8" fill="#FFFFFF"/>

  <!-- Spiral binding holes -->
  <circle cx="80" cy="64" r="4" fill="#1E3A8A"/>
  <circle cx="104" cy="64" r="4" fill="#1E3A8A"/>
  <circle cx="128" cy="64" r="4" fill="#1E3A8A"/>
  <circle cx="152" cy="64" r="4" fill="#1E3A8A"/>
  <circle cx="176" cy="64" r="4" fill="#1E3A8A"/>

  <!-- Lines representing text -->
  <line x1="80" y1="96" x2="176" y2="96" stroke="#94A3B8" stroke-width="2"/>
  <line x1="80" y1="112" x2="176" y2="112" stroke="#94A3B8" stroke-width="2"/>
  <line x1="80" y1="128" x2="160" y2="128" stroke="#94A3B8" stroke-width="2"/>

  <!-- "R++" text -->
  <text x="128" y="176" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="#DC2626" text-anchor="middle" dominant-baseline="middle">R++</text>

  <!-- Orange accent bar (Rust color) -->
  <rect x="64" y="192" width="128" height="8" rx="4" fill="#F97316"/>
</svg>
