# cargo-deny configuration for Notepad++ Rust Edition
# https://github.com/EmbarkStudios/cargo-deny

[advisories]
# Advisory database configuration
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Vulnerability handling
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = [
    # Add specific advisory IDs to ignore here if needed
    # "RUSTSEC-0000-0000",
]

[licenses]
# License policy
unlicensed = "deny"
allow-osi-fsf-free = "neither"
copyleft = "allow"
default = "deny"

# Explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "GPL-3.0",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Licenses to deny
deny = [
    "GPL-2.0",  # Incompatible with GPL-3.0
]

confidence-threshold = 0.8

[licenses.private]
# Allow private/unpublished crates
ignore = false

[bans]
# Dependency banning
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

deny = [
    # Ban specific crates if needed
    # { name = "openssl", wrappers = ["reqwest"] },
]

skip = [
    # Skip specific dependency trees
    # { name = "windows", version = "=0.52" },
]

skip-tree = [
    # Skip entire dependency trees
    # { name = "windows", version = "=0.52" },
]

[sources]
# Source code repositories
unknown-registry = "deny"
unknown-git = "deny"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
# Allow specific GitHub organizations
github = []
